plugins {
    id 'java'
    id 'application'
}

mainClassName = 'com.omegaChess.server.OCMultiServer'

jar {
    manifest {
        attributes(
                'Class-Path': configurations.compile.collect { it.getName() }.join(' '),
                'Main-Class': mainClassName
        )
    }
}

version '1.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':protocol')
    implementation 'org.junit.jupiter:junit-jupiter:5.4.2'
}

test {
    useJUnitPlatform()
}
